<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Iridium Decks icon: a slide with a bar chart, on Iridium green.
       Original artwork; MIT OR Apache-2.0.
       Palette: ink #0b0b0c, paper #efe9dc,
       app colour #0B6E4F. -->
  <defs>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="#0B6E4F"/>
    <!-- the slide, tilted -->
    <g transform="rotate(-4 256 256)" stroke="#0b0b0c" stroke-linejoin="round">
      <rect x="86" y="96" width="340" height="244" rx="14" fill="#efe9dc" stroke-width="12"/>
      <!-- the title line -->
      <rect x="126" y="136" width="170" height="20" fill="#0b0b0c"/>
      <!-- the bars, in the app colour and the ink -->
      <rect x="136" y="236" width="46" height="70" fill="#0B6E4F" stroke="none"/>
      <rect x="202" y="196" width="46" height="110" fill="#0b0b0c" stroke="none"/>
      <rect x="268" y="166" width="46" height="140" fill="#0B6E4F" stroke="none"/>
      <!-- the presenter marker -->
      <circle cx="364" cy="178" r="28" fill="#0b0b0c"/>
    </g>
    <!-- the stand -->
    <rect x="246" y="330" width="20" height="110" fill="#0b0b0c"/>
    <rect x="176" y="430" width="160" height="18" fill="#0b0b0c"/>
  </g>
</svg>
