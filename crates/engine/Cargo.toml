[package]
name = "iridium-decks-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Decks engine: sessions, undo history, selection, the command registry every frontend dispatches through, and pointer tools"

[lints]
workspace = true

[dependencies]
iridium-decks-geom = { workspace = true }
iridium-decks-color = { workspace = true }
iridium-decks-model = { workspace = true }
iridium-decks-fonts = { workspace = true }
iridium-decks-text = { workspace = true }
iridium-decks-render = { workspace = true }
iridium-decks-pdf = { workspace = true }
iridium-decks-format = { workspace = true }
iridium-decks-pptx = { workspace = true }
iridium-decks-media = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
i_overlay = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
image = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
iridium-decks-anim = { workspace = true }
zip = { workspace = true }

# The browser clock for comment timestamps (wasm has no std::time::SystemTime).
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

