[package]
name = "iridium-decks-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Decks egui frontend (PowerPoint-style UI); swappable — nothing below depends on it"

[lints]
workspace = true

[dependencies]
iridium-decks-geom = { workspace = true }
iridium-decks-color = { workspace = true }
iridium-decks-model = { workspace = true }
iridium-decks-fonts = { workspace = true }
iridium-decks-text = { workspace = true }
iridium-decks-render = { workspace = true }
iridium-decks-anim = { workspace = true }
iridium-decks-engine = { workspace = true }
iridium-decks-media = { workspace = true }
egui = { workspace = true, features = ["default_fonts", "monochrome_emoji_fonts"] }
craft-ui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
web-time = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
craft-update = { workspace = true }

[dev-dependencies]
skrifa = { workspace = true }
# kittest's own dev-dependencies do not propagate; tests need both font features explicitly.
egui = { workspace = true, features = ["default_fonts", "monochrome_emoji_fonts"] }
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"
