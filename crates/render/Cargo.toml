[package]
name = "iridium-decks-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Decks renderer: slides, layouts and masters to pixels (vello_cpu): fills, outlines, effects, pictures, text, tables, charts"

[lints]
workspace = true

[dependencies]
iridium-decks-geom = { workspace = true }
iridium-decks-color = { workspace = true }
iridium-decks-metafile = { workspace = true }
iridium-decks-model = { workspace = true }
iridium-decks-anim = { workspace = true }
iridium-decks-fonts = { workspace = true }
iridium-decks-text = { workspace = true }
vello_cpu = { workspace = true }
vello_common = { workspace = true }
image = { workspace = true }
log = { workspace = true }
kurbo = { workspace = true }
skrifa = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vello_cpu = { workspace = true, features = ["multithreading"] }
